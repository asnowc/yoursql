name: Publish
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Publish to npm, jsr, or all"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - npm
          - jsr

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{fromJson(env.PACKAGE_JSON).version}}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Build
        run: pnpm run ci:build
      - name: jsr-dry-run
        if: ${{ github.event.inputs.publish_target == 'all' || github.event.inputs.publish_target == 'jsr' }}
        run: npx jsr publish --dry-run
      - name: npm-dry-run
        if: ${{ github.event.inputs.publish_target == 'all' || github.event.inputs.publish_target == 'npm' }}
        run: npm publish --dry-run

      - name: Read packageJson
        run: |
          {
            echo 'PACKAGE_JSON<<EOF' 
            cat ./package.json
            echo EOF
          } >>  $GITHUB_ENV
      - name: Package npm
        if: ${{ github.event.inputs.publish_target == 'all' || github.event.inputs.publish_target == 'npm' }}
        run: |
          npm pack
          mv asla-yoursql-${{fromJson(env.PACKAGE_JSON).version}}.tgz npm-package.tgz
      - name: Upload npm package
        if: ${{ github.event.inputs.publish_target == 'all' || github.event.inputs.publish_target == 'npm' }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            npm-package.tgz
          retention-days: 3

  publish-npm:
    needs: check
    if: ${{github.repository_owner=='asnowc' && (github.event.inputs.publish_target == 'all' || github.event.inputs.publish_target == 'npm')}}
    runs-on: ubuntu-latest
    steps:
      - name: download
        uses: actions/download-artifact@v4
        with:
          name: npm-package
      - name: Unpack
        run: tar -zxvf npm-package.tgz
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: npm publish
        working-directory: ./package

  publish-jsr:
    runs-on: ubuntu-latest
    needs: check
    if: ${{github.repository_owner=='asnowc' && (github.event.inputs.publish_target == 'all' || github.event.inputs.publish_target == 'jsr')}}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Publish
        run: npx jsr publish
